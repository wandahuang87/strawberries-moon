<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strawberries.moon — product</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream-50);
  color: var(--cosmic-700);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* HEADER (shared style w/ index) */
.nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 32px 36px 28px;
  border-bottom: 1px solid var(--cream-200);
  background: var(--cream-50);
  position: sticky; top: 0; z-index: 20;
}
.nav-left, .nav-right { display: flex; gap: 28px; align-items: center; }
.nav-right { justify-content: flex-end; }
.nav a.link {
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  font-weight: 500; color: var(--cosmic-700);
}
.nav a.link:hover { color: var(--berry-500); }
.cart {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--cosmic-700); color: var(--cream-50);
  padding: 8px 14px; border-radius: 999px;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  font-weight: 500;
}
.cart .pip {
  background: var(--berry-500); border-radius: 999px;
  padding: 0 7px; font-family: var(--font-mono); font-size: 11px;
}

/* PDP */
.crumbs {
  padding: 24px 36px 0;
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .15em; text-transform: uppercase;
  color: var(--fg-3);
}
.crumbs a:hover { color: var(--berry-500); }
.crumbs span { margin: 0 8px; opacity: .5; }

.pdp {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 64px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px 36px 80px;
}
@media (max-width: 880px) {
  .pdp { grid-template-columns: 1fr; gap: 32px; }
}

/* gallery */
.gallery { position: sticky; top: 124px; align-self: start; }
.gallery-hero {
  aspect-ratio: 1;
  background-color: var(--cream-100);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  margin-bottom: 12px;
}
.gallery-hero .placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #ffd7d7 0%, #ffb8d6 100%);
}
.gallery-hero .placeholder img { width: 45%; opacity: .9; }
.gallery-thumbs {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
}
.gallery-thumb {
  aspect-ratio: 1;
  background-color: var(--cream-100);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 200ms;
}
.gallery-thumb.active { border-color: var(--berry-500); }

/* info */
.info { padding-top: 4px; }
.tag {
  display: inline-block;
  background: var(--berry-500); color: var(--cream-50);
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
  font-weight: 500; padding: 5px 10px; border-radius: 999px;
  margin-bottom: 16px;
}
.title {
  font-family: var(--font-display); font-size: 52px;
  font-weight: 400; letter-spacing: -0.025em; line-height: 1.05;
  color: var(--cosmic-700); margin: 0 0 18px;
  font-variation-settings: "opsz" 144;
}
.price {
  font-family: var(--font-display); font-size: 32px;
  letter-spacing: -0.015em; color: var(--berry-500);
  margin-bottom: 28px;
  font-variation-settings: "opsz" 144;
}
.desc {
  font-size: 15.5px; line-height: 1.65;
  color: var(--cosmic-500); margin-bottom: 32px;
  text-wrap: pretty; max-width: 48ch;
}

.field-block { margin-bottom: 28px; }
.field-block .label {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--fg-3); margin-bottom: 12px;
}
.variants { display: flex; flex-wrap: wrap; gap: 8px; }
.variant {
  padding: 11px 18px;
  border: 1px solid var(--cream-200);
  background: var(--cream-50);
  border-radius: 999px;
  font-size: 14px; cursor: pointer;
  transition: all 180ms cubic-bezier(.2,.9,.25,1);
}
.variant:hover { border-color: var(--cosmic-500); }
.variant.active {
  border-color: var(--berry-500);
  background: var(--berry-500); color: var(--cream-50);
}
.variant.oos {
  opacity: .4; cursor: not-allowed; text-decoration: line-through;
}
.stock-pill {
  display: inline-block;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--fg-3); margin-top: 12px;
}
.stock-pill.low { color: var(--berry-500); }

.qty {
  display: inline-flex; align-items: center;
  border: 1px solid var(--cream-200); border-radius: 999px;
  background: var(--cream-50); padding: 4px;
}
.qty button {
  width: 32px; height: 32px; border-radius: 50%;
  border: 0; background: transparent; cursor: pointer;
  font-size: 18px; color: var(--cosmic-700);
}
.qty button:hover { background: var(--cream-200); }
.qty .v {
  min-width: 36px; text-align: center;
  font-family: var(--font-mono); font-size: 14px;
}

.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 18px 28px; border-radius: 999px;
  font-family: var(--font-sans); font-size: 13px;
  letter-spacing: .22em; text-transform: uppercase;
  font-weight: 500; border: 0; cursor: pointer;
  transition: all 200ms cubic-bezier(.2,.9,.25,1);
}
.btn-buy { background: var(--berry-500); color: var(--cream-50); }
.btn-buy:hover { background: var(--berry-700); transform: translateY(-1px); }
.btn-buy:disabled {
  background: var(--cream-200); color: var(--fg-3); cursor: not-allowed;
  transform: none;
}
.btn-add { background: transparent; color: var(--cosmic-700); border: 1.5px solid var(--cosmic-700); }
.btn-add:hover { background: var(--cosmic-700); color: var(--cream-50); }

.warn {
  font-size: 12.5px;
  background: rgba(232,36,58,.06);
  border-left: 3px solid var(--berry-500);
  padding: 12px 14px; margin-top: 12px;
  border-radius: 0 6px 6px 0;
  color: var(--cosmic-700);
}
.warn a { color: var(--berry-500); border-bottom: 1px solid; }

.meta-rows {
  margin-top: 36px; border-top: 1px solid var(--cream-200);
}
.meta-row {
  display: flex; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid var(--cream-200);
  font-size: 13.5px;
}
.meta-row .k { color: var(--fg-3); font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .15em; text-transform: uppercase; }

.notfound {
  text-align: center; padding: 140px 24px; max-width: 520px; margin: 0 auto;
}
.notfound h1 {
  font-family: var(--font-display); font-size: 56px;
  letter-spacing: -0.02em; color: var(--cosmic-700); font-weight: 400;
  margin: 0 0 12px;
}

/* ── MOBILE (iPhone-friendly) ─────────────────────────────── */
@media (max-width: 768px) {
  .nav { padding: 16px 18px 14px; }
  .nav .logo img { height: 54px !important; }
  .nav a.link { font-size: 11px; letter-spacing: .1em; }
  .nav-left { gap: 16px; }
  .crumbs { padding: 16px 18px 0; font-size: 10px; }
  .pdp { padding: 18px 18px 56px; gap: 24px; }
  .gallery { position: static; }
  .gallery-hero { border-radius: 14px; }
  .gallery-thumbs { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .title { font-size: 34px; margin-bottom: 12px; }
  .price { font-size: 26px; margin-bottom: 22px; }
  .desc { font-size: 15px; margin-bottom: 26px; }
  .field-block { margin-bottom: 22px; }
  .variant { padding: 12px 18px; font-size: 15px; }   /* bigger tap target */
  .qty button { width: 40px; height: 40px; }          /* 40px+ tap target */
  .btn { padding: 17px 24px; font-size: 13px; width: 100%; }
  footer { padding-left: 18px !important; padding-right: 18px !important; }
  footer > div { flex-direction: column; gap: 8px; text-align: center; }
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-left">
    <a href="index.html" class="link">shop</a>
    <a href="#" class="link">contact</a>
  </div>
  <a href="index.html" class="logo" style="display:flex;justify-content:center">
    <img src="brand/logo.png" alt="strawberries.moon" style="height:80px;display:block">
  </a>
  <div class="nav-right">
    <a href="#" class="link">contact</a>
  </div>
</header>

<div id="app"></div>

<footer style="background:var(--cosmic-700);color:var(--cream-50);padding:0 36px 24px;border-top:1px solid rgba(255,250,242,.12);margin-top:60px">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:22px 0;font-family:var(--font-mono);font-size:11px;color:var(--cosmic-100);letter-spacing:.04em">
    <span>© 2026 · strawberries.moon · taipei</span>
  </div>
</footer>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="catalog.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const FALLBACKS = [
  'linear-gradient(160deg, #ffd7d7 0%, #ff7a82 100%)',
  'linear-gradient(160deg, #fff3e1 0%, #d6b785 100%)',
  'linear-gradient(160deg, #c8c2ff 0%, #14115c 100%)',
  'linear-gradient(160deg, #ffb8d6 0%, #ffd25a 100%)',
];

function PDP() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const [product, setProduct] = useState(() => Catalog.getProduct(id));
  const [variantId, setVariantId] = useState(() => product?.variants?.[0]?.id || null);
  const [qty, setQty] = useState(1);
  const [heroIdx, setHeroIdx] = useState(0);

  useEffect(() => {
    const onCat = () => setProduct(Catalog.getProduct(id));
    window.addEventListener('catalog:changed', onCat);
    return () => {
      window.removeEventListener('catalog:changed', onCat);
    };
  }, [id]);

  if (!product) {
    return (
      <div className="notfound">
        <h1>this product floated away.</h1>
        <p style={{color:'var(--fg-3)',marginBottom:24}}>we couldn't find a product with that id. it may have been removed.</p>
        <a href="index.html" className="btn btn-buy" style={{display:'inline-flex',textDecoration:'none'}}>back to the shop</a>
      </div>
    );
  }

  const variant = product.variants?.find(v => v.id === variantId) || null;
  const inStock = product.variants?.length ? (variant?.stock > 0) : true;
  const hasLink = !!product.buyLink?.trim();
  const hero = product.photos?.[heroIdx];
  const fb = FALLBACKS[(product.id.charCodeAt(2) || 0) % FALLBACKS.length];

  function buyNow() {
    if (!hasLink) return;
    window.open(product.buyLink, '_blank', 'noopener');
  }

  return (
    <>
      <div className="crumbs">
        <a href="index.html">shop</a>
        <span>/</span>
        <span style={{color:'var(--cosmic-700)'}}>{product.title}</span>
      </div>

      <section className="pdp">
        <div className="gallery">
          <div className="gallery-hero" style={{
            backgroundImage: hero ? `url(${hero})` : 'none'
          }}>
            {!hero && (
              <div className="placeholder" style={{background: fb}}>
                <img src="assets/camera.svg" alt="" />
              </div>
            )}
          </div>
          {product.photos?.length > 1 && (
            <div className="gallery-thumbs">
              {product.photos.slice(0, 5).map((src, i) => (
                <div key={i}
                  className={`gallery-thumb ${i === heroIdx ? 'active' : ''}`}
                  onClick={() => setHeroIdx(i)}
                  style={{ backgroundImage: `url(${src})` }} />
              ))}
            </div>
          )}
        </div>

        <div className="info">
          {product.tag && <div className="tag">{product.tag}</div>}
          <h1 className="title">{product.title}</h1>
          <div className="price">{product.currency} {product.price.toLocaleString()}</div>
          {product.description && <p className="desc">{product.description}</p>}

          {product.variants?.length > 0 && (
            <div className="field-block">
              <div className="label">{product.variants.length === 1 ? 'option' : 'choose your option'}</div>
              <div className="variants">
                {product.variants.map(v => (
                  <button key={v.id}
                    className={`variant ${v.id === variantId ? 'active' : ''} ${v.stock <= 0 ? 'oos' : ''}`}
                    onClick={() => v.stock > 0 && setVariantId(v.id)}>
                    {v.label || 'unnamed'}
                  </button>
                ))}
              </div>
              {variant && (
                <div className={`stock-pill ${variant.stock <= 5 && variant.stock > 0 ? 'low' : ''}`}>
                  {variant.stock <= 0 ? 'sold out' : variant.stock <= 5 ? `only ${variant.stock} left` : `${variant.stock} in stock`}
                </div>
              )}
            </div>
          )}

          <div className="field-block">
            <div className="label">quantity</div>
            <div className="qty">
              <button onClick={() => setQty(q => Math.max(1, q - 1))}>−</button>
              <span className="v">{qty}</span>
              <button onClick={() => setQty(q => q + 1)}>+</button>
            </div>
          </div>

          <div className="actions">
            <button className="btn btn-buy"
              onClick={buyNow} disabled={!hasLink || !inStock}>
              {!inStock ? 'sold out' : hasLink ? 'buy on 賣貨便 →' : 'coming soon'}
            </button>
          </div>

          {!hasLink && (
            <div className="warn">
              <b>no order link yet.</b> open the <a href={`admin.html`}>admin page</a> and paste this product's 7-11 賣貨便 link to let customers order.
            </div>
          )}

          <div className="meta-rows">
            <div className="meta-row"><span className="k">order &amp; pay</span><span>via 7-11 賣貨便</span></div>
            <div className="meta-row"><span className="k">id</span><span style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--fg-3)'}}>{product.id}</span></div>
          </div>
        </div>
      </section>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<PDP />);
</script>

</body>
</html>
