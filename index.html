<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strawberries.moon — shop</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream-50);
  color: var(--cosmic-700);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ── HEADER (3-col, big centered logo) ─────────────────────── */
.nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 32px 36px 28px;
  border-bottom: 1px solid var(--cream-200);
  background: var(--cream-50);
  position: sticky; top: 0; z-index: 20;
}
.nav-left, .nav-right { display: flex; gap: 28px; align-items: center; }
.nav-right { justify-content: flex-end; }
.nav a.link {
  font-size: 13px;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--cosmic-700);
  position: relative;
}
.nav a.link:hover::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -4px;
  height: 1px; background: var(--berry-500);
}
.logo {
  display: flex; align-items: center; justify-content: center;
}
.logo .wordmark {
  font-family: var(--font-display);
  font-size: 36px;
  letter-spacing: -0.025em;
  font-weight: 400;
  line-height: 1;
  color: var(--berry-500);
  align-items: baseline;
}
.logo .end { color: var(--cosmic-700); }
.logo .dot {
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background: var(--berry-500); margin: 0 3px 4px;
}

/* ── HERO CAROUSEL ─────────────────────────────────────────── */
.hero {
  position: relative;
  height: 78vh; min-height: 580px; max-height: 780px;
  overflow: hidden;
}
.slide {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 800ms var(--ease-soft);
  display: flex; align-items: flex-end;
  padding: 64px;
}
.slide.active { opacity: 1; }
.slide-bg { position: absolute; inset: 0; z-index: 0; }
.slide-grain {
  position: absolute; inset: 0; z-index: 1;
  background-image: radial-gradient(rgba(90,47,36,0.05) 1px, transparent 1px);
  background-size: 4px 4px;
  pointer-events: none;
}
.slide-content {
  position: relative; z-index: 2;
  display: flex; align-items: flex-end; justify-content: space-between;
  width: 100%; gap: 64px;
}
.slide-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--cream-50);
  margin-bottom: 14px;
  opacity: .85;
}
.slide-headline {
  font-family: var(--font-display);
  font-size: clamp(48px, 7vw, 104px);
  line-height: .96;
  letter-spacing: -0.01em;
  color: var(--cream-50);
  font-weight: 400;
  max-width: 11ch;
}
.slide-cta {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--cream-50);
  color: var(--cosmic-700);
  padding: 16px 28px;
  border-radius: 999px;
  border: 0;
  font-family: var(--font-sans);
  font-size: 13px;
  letter-spacing: .22em;
  text-transform: uppercase;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--dur-quick) var(--ease-soft);
  box-shadow: var(--sh-card);
}
.slide-cta:hover { background: var(--berry-500); color: var(--cream-50); }
.slide-counter {
  position: absolute; bottom: 32px; right: 36px;
  display: flex; gap: 10px; z-index: 5;
}
.slide-counter button {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--cream-50);
  background: transparent;
  color: var(--cream-50);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: all var(--dur-quick) var(--ease-soft);
}
.slide-counter button.active { background: var(--cream-50); color: var(--cosmic-700); }

/* slide variants — soft pink / coral / cream stand-ins for photos */
.slide-1 .slide-bg {
  background:
    radial-gradient(at 30% 30%, #ffd1d4 0%, transparent 55%),
    radial-gradient(at 70% 70%, #e89aa1 0%, transparent 60%),
    linear-gradient(135deg, #f5b8bd 0%, #c97557 100%);
}
.slide-2 .slide-bg {
  background:
    radial-gradient(at 60% 30%, #ffe6e6 0%, transparent 50%),
    linear-gradient(160deg, #d97c83 0%, #a85a3e 100%);
}
.slide-3 .slide-bg {
  background:
    radial-gradient(at 40% 60%, #fff3e1 0%, transparent 50%),
    linear-gradient(135deg, #e9d3ad 0%, #b89564 100%);
}
.slide-4 .slide-bg {
  background:
    radial-gradient(at 30% 50%, #ffe6e6 0%, transparent 50%),
    linear-gradient(135deg, #ffd1d4 0%, #f5b8bd 100%);
}
.slide-5 .slide-bg {
  background:
    radial-gradient(at 50% 50%, #e89aa1 0%, transparent 60%),
    linear-gradient(180deg, #d97c83 0%, #7e3f29 100%);
}
.slide-orn { position: absolute; z-index: 1; pointer-events: none; }
.slide-1 .slide-orn { top: 18%; left: 38%; transform: rotate(-12deg); }
.slide-2 .slide-orn { top: 14%; right: 14%; }
.slide-3 .slide-orn { top: 22%; right: 22%; transform: rotate(6deg); }
.slide-4 .slide-orn { top: 16%; right: 18%; transform: rotate(-8deg); }
.slide-5 .slide-orn { top: 18%; left: 50%; transform: translateX(-50%); }

/* ── TAGLINE SECTION ──────────────────────────────────────── */
.tagline {
  padding: 80px 36px;
  text-align: center;
  background: var(--cream-50);
  position: relative;
}
.tagline::before, .tagline::after {
  content: '✰'; color: var(--berry-500);
  font-size: 22px; margin: 0 18px; vertical-align: middle;
}
.tagline-text {
  display: inline-block;
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 52px);
  letter-spacing: -0.01em;
  font-weight: 400;
  color: var(--cosmic-700);
}
.tagline-text em { font-family: var(--font-display); font-style: italic; color: var(--berry-500); }
.tagline-sub {
  margin-top: 18px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--fg-3);
}

/* ── PRODUCTS GRID ────────────────────────────────────────── */
.products { padding: 24px 36px 96px; max-width: 1440px; margin: 0 auto; }
.products-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 28px;
}
.products-head h2 {
  font-family: var(--font-display);
  font-size: 34px; font-weight: 400; letter-spacing: -0.01em;
  margin: 0; color: var(--coral-400);
}
.products-head a {
  font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
  font-weight: 500; color: var(--cosmic-700);
  border-bottom: 1px solid var(--cosmic-700); padding-bottom: 2px;
}
.products-head a:hover { color: var(--berry-500); border-color: var(--berry-500); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px 24px; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } }

/* ── NEWSLETTER ──────────────────────────────────────────── */
.news {
  background: var(--coral-500);
  color: var(--cream-50);
  padding: 96px 36px;
  text-align: center;
}
.news h3 {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 60px);
  letter-spacing: -0.01em; font-weight: 400;
  margin: 0 0 14px;
}
.news p { max-width: 520px; margin: 0 auto 32px; color: var(--pink-100); font-size: 15px; line-height: 1.55; }
.news-form {
  display: flex; max-width: 480px; margin: 0 auto;
  background: rgba(255, 250, 242, 0.12);
  border: 1px solid rgba(255, 250, 242, 0.28);
  border-radius: 999px; padding: 4px;
}
.news-form input {
  flex: 1; border: 0; background: transparent;
  padding: 12px 18px; color: var(--cream-50);
  font-family: var(--font-sans); font-size: 14px; outline: none;
}
.news-form input::placeholder { color: rgba(255, 250, 242, 0.6); }
.news-form button {
  background: var(--berry-500); color: var(--cream-50);
  border: 0; padding: 11px 22px; border-radius: 999px;
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  letter-spacing: .22em; text-transform: uppercase; cursor: pointer;
  transition: background var(--dur-quick);
}
.news-form button:hover { background: var(--berry-700); }

/* ── FOOTER ──────────────────────────────────────────────── */
.foot {
  background: var(--coral-600);
  color: var(--cream-50);
  padding: 0 36px 24px;
  border-top: 1px solid rgba(255, 250, 242, 0.14);
}
.foot-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 0;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--pink-100); letter-spacing: .04em;
}
.foot-row a { margin-left: 22px; }
.foot-row a:hover { color: var(--cream-50); }

/* ── MOBILE (iPhone-friendly) ─────────────────────────────── */
@media (max-width: 768px) {
  .nav { padding: 14px 16px 12px; }
  .nav .logo img { height: 72px !important; }
  .nav a.link { font-size: 11px; letter-spacing: .08em; }
  .nav-left, .nav-right { gap: 14px; }

  .hero { height: auto; min-height: 0; max-height: none; }
  .slide { position: relative; padding: 28px 18px 24px; min-height: 64vh; }
  .slide:not(.active) { display: none; }       /* stack cleanly, no overlap */
  .slide.active { position: relative; opacity: 1; }
  .slide-content { flex-direction: column; align-items: flex-start; gap: 20px; }
  .slide-headline { font-size: 44px; max-width: 100%; }
  .slide-orn { width: 150px !important; top: auto !important; right: 18px !important; left: auto !important; bottom: 30%; opacity: .85; }
  .slide-cta { padding: 14px 22px; font-size: 12px; }
  .slide-counter { bottom: 16px; right: 16px; }

  .tagline { padding: 48px 20px; }
  .tagline::before, .tagline::after { display: block; margin: 0 0 10px; }
  .tagline::after { margin: 10px 0 0; }

  .products { padding: 20px 16px 64px; }
  .products-head h2 { font-size: 26px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 18px 12px; }

  .news { padding: 56px 20px; }
  .news-form { flex-direction: column; background: transparent; border: 0; padding: 0; gap: 10px; }
  .news-form input { background: rgba(255,250,242,.12); border: 1px solid rgba(255,250,242,.28); border-radius: 999px; text-align: center; padding: 14px; }
  .news-form button { padding: 14px; }

  .foot { padding: 0 18px 20px; }
  .foot-row { flex-direction: column; gap: 10px; text-align: center; padding: 18px 0; }
  .foot-row a { margin: 0 11px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="nav">
  <div class="nav-left">
    <a href="#products" class="link">shop</a>
    <a href="#contact" class="link">contact</a>
  </div>
  <a href="index.html" class="logo">
    <img src="brand/logo.png" alt="strawberries.moon" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'" style="height:160px;display:block">
    <span class="wordmark" style="display:none">
      strawberries<span class="dot"></span><span class="end">moon</span>
    </span>
  </a>
  <div class="nav-right">
    <a href="#contact" class="link">繁中 / en</a>
  </div>
</header>

<!-- HERO CAROUSEL -->
<section class="hero" id="hero">
  <div class="slide-counter" id="slide-counter"></div>
</section>

<!-- TAGLINE -->
<section class="tagline">
  <div class="tagline-text" style="font-family: Georgia">
    you've got <em>memories,</em> we've got film.
  </div>
  <div class="tagline-sub" style="font-size: 14px">送給自己或別人的一段時光 ✰ʚɞ꙳</div>

<!-- PRODUCTS -->
<section class="products" id="products">
  <div class="products-head">
    <h2>products</h2>
    <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-3)">order on 7-11 賣貨便</span>
  </div>

<!-- NEWSLETTER -->

<!-- FOOTER -->
<footer class="foot">

      <a href="#">about</a>
      <a href="#">care</a>
      <a href="#">instagram</a>
    </span>
  </div>
</footer>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="catalog.js"></script>

<script>
// carousel — built dynamically from editable banners (Catalog.loadBanners)
(() => {
  function build() {
  const hero = document.getElementById('hero');
  const counter = document.getElementById('slide-counter');
  const FALLBACK_BG = [
    'radial-gradient(at 30% 30%, #ffd1d4 0%, transparent 55%), linear-gradient(135deg, #ffe6e6 0%, #f5b8bd 100%)',
    'radial-gradient(at 60% 30%, #ffe6e6 0%, transparent 50%), linear-gradient(160deg, #f5b8bd 0%, #d97c83 100%)',
    'radial-gradient(at 40% 60%, #fff3e1 0%, transparent 50%), linear-gradient(135deg, #ffd1d4 0%, #e89aa1 100%)',
    'radial-gradient(at 30% 50%, #ffe6e6 0%, transparent 50%), linear-gradient(135deg, #ffd1d4 0%, #ffb8d6 100%)',
    'radial-gradient(at 50% 50%, #fff0e0 0%, transparent 60%), linear-gradient(180deg, #f5b8bd 0%, #e89aa1 100%)',
  ];
  const FALLBACK_GLYPH = ['assets/strawberry.svg','assets/moon.svg','assets/camera.svg','assets/sparkle.svg','assets/monogram.svg'];

  let banners = [];
  try { banners = (window.Catalog && Catalog.loadBanners()) || []; } catch (e) {}
  if (!banners.length) {
    banners = [{ tag: '', headline: 'strawberries.moon', photo: '', link: '#products' }];
  }

  // build slides
  banners.forEach((b, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide' + (i === 0 ? ' active' : '');

    const bg = document.createElement('div');
    bg.className = 'slide-bg';
    if (b.photo) {
      bg.style.backgroundImage = 'url(' + b.photo + ')';
      bg.style.backgroundSize = 'cover';
      bg.style.backgroundPosition = 'center';
      bg.style.backgroundRepeat = 'no-repeat';
    } else {
      bg.style.background = FALLBACK_BG[i % FALLBACK_BG.length];
    }
    slide.appendChild(bg);

    const grain = document.createElement('div');
    grain.className = 'slide-grain';
    slide.appendChild(grain);

    if (!b.photo) {
      const orn = document.createElement('img');
      orn.className = 'slide-orn';
      orn.src = FALLBACK_GLYPH[i % FALLBACK_GLYPH.length];
      orn.width = 240;
      orn.alt = '';
      slide.appendChild(orn);
    }

    const content = document.createElement('div');
    content.className = 'slide-content';
    const textWrap = document.createElement('div');
    if (b.tag) {
      const tag = document.createElement('div');
      tag.className = 'slide-tag';
      tag.textContent = b.tag;          // textContent = safe, no HTML injection
      textWrap.appendChild(tag);
    }
    const h = document.createElement('h2');
    h.className = 'slide-headline';
    h.textContent = b.headline || '';
    textWrap.appendChild(h);
    content.appendChild(textWrap);

    const cta = document.createElement('a');
    cta.className = 'slide-cta';
    cta.href = b.link || '#products';
    cta.textContent = 'shop now →';
    content.appendChild(cta);

    slide.appendChild(content);
    hero.insertBefore(slide, counter);
  });

  const slides = hero.querySelectorAll('.slide');
  let active = 0;
  slides.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.textContent = String(i + 1).padStart(2, '0');
    if (i === 0) btn.classList.add('active');
    btn.onclick = () => go(i);
    counter.appendChild(btn);
  });
  function go(i) {
    slides[active].classList.remove('active');
    counter.children[active].classList.remove('active');
    active = i;
    slides[active].classList.add('active');
    counter.children[active].classList.add('active');
  }
  if (slides.length > 1) setInterval(() => go((active + 1) % slides.length), 6000);
  }
  // Wait for IndexedDB hydrate so the owner sees their saved banners.
  if (window.Catalog && Catalog.ready && Catalog.ready.then) Catalog.ready.then(build);
  else build();
})();
</script>

<script type="text/babel">
const FALLBACK_GRADIENTS = [
  'linear-gradient(160deg, #ffe6e6 0%, #e89aa1 100%)',
  'linear-gradient(160deg, #fff3e1 0%, #e9d3ad 100%)',
  'linear-gradient(160deg, #ffd1d4 0%, #d97c83 100%)',
  'linear-gradient(160deg, #ffe6e6 0%, #f5b8bd 100%)',
  'linear-gradient(160deg, #fff0e0 0%, #ffd1d4 100%)',
  'linear-gradient(160deg, #fffaf2 0%, #f6e6cc 100%)',
];
const FALLBACK_GLYPHS = [
  'assets/camera.svg',
  'assets/strawberry.svg',
  'assets/moon.svg',
  'assets/sparkle.svg',
];

function ProductCard({ product, idx }) {
  const [hover, setHover] = React.useState(false);
  const photo = product.photos?.[0];
  const hasLink = !!product.buyLink?.trim();
  const fallbackBg = FALLBACK_GRADIENTS[idx % FALLBACK_GRADIENTS.length];
  const fallbackGlyph = FALLBACK_GLYPHS[idx % FALLBACK_GLYPHS.length];

  return (
    <a href={`product.html?id=${encodeURIComponent(product.id)}`}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ position: 'relative', cursor: 'pointer', display: 'block', color: 'inherit' }}>
      <div style={{
        aspectRatio: '1',
        background: photo ? `var(--cream-100) url(${photo}) center/cover` : fallbackBg,
        borderRadius: 8, position: 'relative', overflow: 'hidden', marginBottom: 14,
        boxShadow: hover ? '0 16px 40px rgba(168,90,62,0.16)' : 'none',
        transition: 'box-shadow 240ms cubic-bezier(.2,.9,.25,1)'
      }}>
        {!photo && <img src={fallbackGlyph} alt="" style={{
          position: 'absolute', left: '50%', top: '50%',
          transform: `translate(-50%,-50%) scale(${hover ? 1.06 : 1}) rotate(${hover ? -4 : 0}deg)`,
          width: '50%', transition: 'transform 320ms cubic-bezier(.2,.9,.25,1)',
          filter: 'drop-shadow(0 12px 24px rgba(168,90,62,0.2))'
        }} />}
        {product.tag && (
          <span style={{
            position: 'absolute', top: 14, left: 14,
            background: 'var(--cream-50)', color: 'var(--coral-500)',
            fontSize: 10, letterSpacing: '.22em', textTransform: 'uppercase',
            fontWeight: 500, padding: '5px 10px', borderRadius: 999
          }}>{product.tag}</span>
        )}
        <div style={{
          position: 'absolute', bottom: 14, left: 14, right: 14,
          background: 'var(--berry-500)', color: 'var(--cream-50)',
          padding: '11px 14px', borderRadius: 999, textAlign: 'center',
          fontFamily: 'var(--font-sans)', fontSize: 12, fontWeight: 500,
          letterSpacing: '.18em', textTransform: 'uppercase',
          opacity: hover ? 1 : 0,
          transform: hover ? 'translateY(0)' : 'translateY(8px)',
          transition: 'all 240ms cubic-bezier(.2,.9,.25,1)'
        }}>
          {hasLink ? 'buy on 賣貨便 →' : 'view →'}
        </div>
      </div>
      <div style={{
        fontFamily: 'var(--font-display)', fontSize: 19, fontWeight: 400,
        letterSpacing: '-0.005em', lineHeight: 1.15,
        color: 'var(--cosmic-700)', marginBottom: 4
      }}>{product.title}</div>
      <div style={{
        fontFamily: 'var(--font-mono)', fontSize: 13,
        color: 'var(--berry-500)', letterSpacing: '.04em'
      }}>{product.currency} {product.price.toLocaleString()}</div>
    </a>
  );
}

function Grid() {
  const [products, setProducts] = React.useState(() => Catalog.load().products);
  React.useEffect(() => {
    const onCat = () => setProducts(Catalog.load().products);
    window.addEventListener('catalog:changed', onCat);
    window.addEventListener('storage', onCat);
    return () => {
      window.removeEventListener('catalog:changed', onCat);
      window.removeEventListener('storage', onCat);
    };
  }, []);

  if (!products.length) {
    return (
      <div style={{ gridColumn: '1 / -1', textAlign: 'center', padding: '80px 20px', color: 'var(--fg-3)' }}>
        <div style={{fontFamily:'var(--font-display)',fontSize:32,color:'var(--cosmic-700)',marginBottom:8}}>
          no products yet
        </div>
        <p>head to the <a href="admin.html" style={{color:'var(--berry-500)',borderBottom:'1px solid'}}>admin page</a> to add your first one.</p>
      </div>
    );
  }

  return <>{products.map((p, i) => <ProductCard key={p.id} product={p} idx={i} />)}</>;
}

ReactDOM.createRoot(document.getElementById('grid')).render(<Grid />);
</script>

</body>
</html>
